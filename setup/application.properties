 # MySQL Properties
 spring.datasource.url=jdbc:mysql://localhost:3306/online_bidding_system?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=UTC
 spring.datasource.username=root
 spring.datasource.password=root
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

 # JPA/Hibernate Properties
 spring.jpa.hibernate.ddl-auto=update
 spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 spring.jpa.show-sql=false
 spring.jpa.properties.hibernate.format_sql=true

 # Swagger/OpenAPI Properties
 springdoc.packagesToScan=com.biddingsystem.controller
 springdoc.pathsToMatch=/api/**
 springdoc.swagger-ui.path=/swagger-ui.html

 # File upload properties
 com.onlinebidding.image.folder.path=C:/Online_auction_system/images/

 # Multipart upload properties
 spring.servlet.multipart.max-file-size=10MB
 spring.servlet.multipart.max-request-size=10MB
 spring.servlet.multipart.enabled=true

 # Logging
 logging.level.root=INFO
 logging.level.com.biddingsystem=DEBUG

 # Server Properties
 server.port=8080
 server.servlet.context-path=/

 # Connection Pool Properties
 spring.datasource.hikari.maximum-pool-size=20
 spring.datasource.hikari.minimum-idle=5
 spring.datasource.hikari.idle-timeout=600000
 spring.datasource.hikari.max-lifetime=1800000
